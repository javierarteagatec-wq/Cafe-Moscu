<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Café Admin — Control de Stock</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;500;600&display=swap');

  :root {
    --bg:        #1a1410;
    --surface:   #231d17;
    --card:      #2c2419;
    --border:    #3d3128;
    --accent:    #c8813a;
    --accent2:   #e8a85a;
    --text:      #f0e8df;
    --muted:     #8a7a6a;
    --ok:        #5a9e6e;
    --warn:      #c8a03a;
    --danger:    #c85a3a;
    --radius:    10px;
    --header-h:  56px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }

  /* ── Header ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 16px;
    height: var(--header-h);
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 19px;
    color: var(--accent2);
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  .logo span {
    color: var(--muted);
    font-size: 11px;
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    margin-left: 8px;
    display: none; /* hidden on mobile */
  }
  @media(min-width: 600px) { .logo span { display: inline; } }

  .header-actions { display: flex; gap: 8px; align-items: center; }

  /* ── Buttons ── */
  .btn {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    padding: 8px 14px;
    border-radius: var(--radius);
    border: none;
    cursor: pointer;
    transition: opacity .15s, transform .1s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    min-height: 40px;
  }
  .btn:active { transform: scale(.96); }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { opacity: .88; }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .btn-ghost:hover { color: var(--text); border-color: var(--accent); }
  .btn-wa { background: #25D366; color: #fff; font-weight: 600; }
  .btn-wa:hover { opacity: .88; }
  .btn-danger { background: var(--danger); color: #fff; }
  /* Icon-only button for small screens */
  .btn-icon {
    padding: 8px 10px;
    font-size: 16px;
  }

  /* ── Layout ── */
  .main { max-width: 1280px; margin: 0 auto; padding: 16px 12px; }
  @media(min-width: 600px) { .main { padding: 24px 20px; } }

  /* ── Stats bar ── */
  .stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }
  @media(min-width: 600px) { .stats { grid-template-columns: repeat(4, 1fr); gap: 14px; } }

  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
  }
  .stat-label { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 4px; }
  .stat-value { font-size: 26px; font-weight: 600; line-height: 1; }
  .stat-value.ok    { color: var(--ok); }
  .stat-value.warn  { color: var(--warn); }
  .stat-value.danger{ color: var(--danger); }
  .stat-value.neutral{ color: var(--accent2); }

  /* ── Toolbar ── */
  .toolbar {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    flex-wrap: wrap;
    align-items: center;
  }
  .search-wrap { position: relative; flex: 1; min-width: 140px; }
  .search-wrap input {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    padding: 9px 12px 9px 34px;
    font-size: 14px;
    outline: none;
    transition: border-color .15s;
    min-height: 40px;
  }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; font-size: 14px; }

  select.filter {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    padding: 8px 10px;
    font-size: 13px;
    outline: none;
    cursor: pointer;
    min-height: 40px;
  }
  select.filter:focus { border-color: var(--accent); }
  select.filter option { background: var(--card); }

  /* ── Category tabs ── */
  .cat-tabs-wrap {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    margin-bottom: 16px;
    padding-bottom: 4px;
  }
  .cat-tabs-wrap::-webkit-scrollbar { display: none; }
  .cat-tabs {
    display: flex;
    gap: 6px;
    white-space: nowrap;
  }
  .cat-tab {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
    transition: all .15s;
    font-family: 'Inter', sans-serif;
    white-space: nowrap;
    flex-shrink: 0;
    min-height: 32px;
    touch-action: manipulation;
  }
  .cat-tab:hover { color: var(--text); border-color: var(--accent); }
  .cat-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* ── Table wrapper — horizontal scroll on mobile ── */
  .table-wrap {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .table-scroll {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .table-scroll::-webkit-scrollbar { height: 4px; }
  .table-scroll::-webkit-scrollbar-track { background: transparent; }
  .table-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  table { width: 100%; border-collapse: collapse; min-width: 600px; }
  thead th {
    background: var(--surface);
    padding: 11px 12px;
    text-align: left;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .07em;
    color: var(--muted);
    font-weight: 500;
    white-space: nowrap;
    position: sticky;
    top: 0;
  }
  tbody tr {
    border-top: 1px solid var(--border);
    transition: background .1s;
  }
  tbody tr:hover { background: rgba(200,129,58,.06); }
  td { padding: 10px 12px; vertical-align: middle; }

  .item-name { font-weight: 500; color: var(--text); font-size: 13px; }
  .item-cat {
    display: inline-block;
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 20px;
    background: rgba(200,129,58,.15);
    color: var(--accent2);
    white-space: nowrap;
  }

  .pill {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
  }
  .pill-ok     { background: rgba(90,158,110,.15); color: var(--ok); }
  .pill-warn   { background: rgba(200,160,58,.15); color: var(--warn); }
  .pill-danger { background: rgba(200,90,58,.15);  color: var(--danger); }

  /* qty control */
  .qty-ctrl { display: flex; align-items: center; gap: 4px; }
  .qty-ctrl input {
    width: 58px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 5px 6px;
    text-align: center;
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    outline: none;
  }
  .qty-ctrl input:focus { border-color: var(--accent); }
  .qty-btn {
    width: 30px; height: 30px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    transition: all .1s;
    font-family: 'Inter', sans-serif;
    touch-action: manipulation;
    flex-shrink: 0;
  }
  .qty-btn:hover, .qty-btn:active { background: var(--accent); border-color: var(--accent); }

  .min-input {
    width: 58px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    padding: 5px 6px;
    text-align: center;
    font-size: 13px;
    font-family: 'Inter', sans-serif;
    outline: none;
  }
  .min-input:focus { border-color: var(--accent); color: var(--text); }

  .check-col { cursor: pointer; accent-color: var(--accent); width: 16px; height: 16px; }

  /* ── Action buttons in table ── */
  .td-actions { display: flex; gap: 4px; }
  .td-actions .btn { padding: 5px 9px; font-size: 13px; min-height: 32px; }

  /* ── Modal — fullscreen on mobile ── */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,.7);
    z-index: 200;
    align-items: flex-end;
    justify-content: center;
  }
  @media(min-width: 520px) {
    .modal-overlay { align-items: center; }
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px 16px 0 0;
    padding: 24px 20px;
    width: 100%;
    max-width: 100%;
    max-height: 92vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  @media(min-width: 520px) {
    .modal {
      border-radius: 14px;
      width: 480px;
      max-width: 95vw;
    }
  }
  /* Drag handle */
  .modal-handle {
    width: 40px; height: 4px;
    background: var(--border);
    border-radius: 4px;
    margin: 0 auto 20px;
    display: block;
  }
  @media(min-width: 520px) { .modal-handle { display: none; } }

  .modal h2 {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    color: var(--accent2);
    margin-bottom: 18px;
  }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media(max-width: 380px) { .form-grid { grid-template-columns: 1fr; } }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group.full { grid-column: 1 / -1; }
  .form-group label { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
  .form-group input, .form-group select {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 10px 12px;
    font-size: 16px; /* 16px prevents iOS zoom */
    font-family: 'Inter', sans-serif;
    outline: none;
    min-height: 44px;
  }
  .form-group input:focus, .form-group select:focus { border-color: var(--accent); }
  .form-group select option { background: var(--surface); }

  .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
  .modal-footer .btn { flex: 1; justify-content: center; min-height: 46px; font-size: 15px; }

  /* ── WhatsApp panel ── */
  .wa-panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 16px;
    margin-top: 20px;
  }
  .wa-panel h3 {
    font-family: 'Playfair Display', serif;
    color: var(--accent2);
    margin-bottom: 14px;
    font-size: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .wa-config { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
  .wa-config .form-group input {
    font-size: 16px; /* prevent iOS zoom */
  }
  .wa-preview {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    font-size: 12px;
    line-height: 1.7;
    white-space: pre-wrap;
    color: var(--text);
    margin-bottom: 14px;
    max-height: 200px;
    overflow-y: auto;
    font-family: monospace;
    -webkit-overflow-scrolling: touch;
  }
  .wa-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .wa-actions .btn { justify-content: center; min-height: 46px; font-size: 14px; }
  .wa-hint { color: var(--muted); font-size: 11px; text-align: center; margin-top: 6px; }

  /* ── Toasts ── */
  #toast {
    position: fixed;
    bottom: 20px; left: 50%; transform: translateX(-50%) translateY(10px);
    background: var(--ok);
    color: #fff;
    padding: 11px 20px;
    border-radius: 24px;
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    transition: all .25s;
    z-index: 999;
    pointer-events: none;
    white-space: nowrap;
    box-shadow: 0 4px 20px rgba(0,0,0,.4);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── Empty state ── */
  .empty { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 14px; }

  /* ── Scroll hint on table ── */
  .scroll-hint {
    text-align: right;
    font-size: 11px;
    color: var(--muted);
    padding: 6px 12px 0;
    display: none;
  }
  @media(max-width: 700px) { .scroll-hint { display: block; } }

  /* ── Fab (floating add button) on mobile ── */
  .fab {
    display: none;
    position: fixed;
    bottom: 24px; right: 20px;
    width: 52px; height: 52px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 50%;
    font-size: 26px;
    cursor: pointer;
    z-index: 150;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 16px rgba(200,129,58,.5);
    touch-action: manipulation;
    transition: transform .15s;
  }
  .fab:active { transform: scale(.93); }
  @media(max-width: 520px) {
    .fab { display: flex; }
    .header-add { display: none; }
  }

  /* ── Select faltantes row ── */
  .toolbar-bottom {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .toolbar-bottom .btn { flex: 1; justify-content: center; min-height: 40px; font-size: 12px; }
</style>
</head>
<body>

<header>
  <div class="logo">☕ Café Moscu <span>Control de Stock</span></div>
  <div class="header-actions">
    <button class="btn btn-ghost btn-icon" onclick="exportCSV()" title="Exportar CSV">⬇</button>
    <button class="btn btn-primary header-add" onclick="openAddModal()">+ Agregar</button>
  </div>
</header>

<!-- Floating add button (mobile only) -->
<button class="fab" onclick="openAddModal()" aria-label="Agregar insumo">+</button>

<div class="main">

  <!-- Stats -->
  <div class="stats">
    <div class="stat-card">
      <div class="stat-label">Total</div>
      <div class="stat-value neutral" id="stat-total">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Stock OK</div>
      <div class="stat-value ok" id="stat-ok">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Stock bajo</div>
      <div class="stat-value warn" id="stat-low">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Sin stock</div>
      <div class="stat-value danger" id="stat-zero">0</div>
    </div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="search" placeholder="Buscar insumo..." oninput="renderTable()" autocomplete="off" autocorrect="off" spellcheck="false">
    </div>
    <select class="filter" id="filterStatus" onchange="renderTable()">
      <option value="">Todos</option>
      <option value="ok">OK</option>
      <option value="low">Bajo</option>
      <option value="zero">Sin stock</option>
    </select>
  </div>

  <!-- Select faltantes -->
  <div class="toolbar-bottom">
    <button class="btn btn-ghost" onclick="toggleSelectFaltantes()">☑ Seleccionar faltantes</button>
    <button class="btn btn-ghost" onclick="generateMessage(); document.querySelector('.wa-panel').scrollIntoView({behavior:'smooth'})">📲 Generar pedido</button>
  </div>

  <!-- Category tabs (scrollable) -->
  <div class="cat-tabs-wrap">
    <div class="cat-tabs" id="catTabs"></div>
  </div>

  <!-- Scroll hint -->
  <div class="scroll-hint">← deslizá la tabla →</div>

  <!-- Table -->
  <div class="table-wrap">
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th style="width:32px"><input type="checkbox" id="checkAll" onchange="toggleCheckAll(this)" style="accent-color:var(--accent);cursor:pointer;"></th>
            <th>Insumo</th>
            <th>Categoría</th>
            <th>Stock</th>
            <th>Mín.</th>
            <th>Unidad</th>
            <th>Estado</th>
            <th>Acc.</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div class="empty" id="emptyMsg" style="display:none">No se encontraron insumos.</div>
  </div>

  <!-- WhatsApp panel -->
  <div class="wa-panel">
    <h3>📲 Enviar pedido por WhatsApp</h3>
    <div class="wa-config">
      <div class="form-group">
        <label>Número del proveedor / encargado</label>
        <input type="tel" id="waNumber" placeholder="+54 9 387 000-0000" inputmode="tel">
      </div>
      <div class="form-group">
        <label>Nombre del local</label>
        <input type="text" id="waLocal" placeholder="Cafetería El Aroma" value="Moscu Cafe-Bar">
      </div>
      <button class="btn btn-ghost" onclick="generateMessage()" style="justify-content:center;min-height:44px">🔄 Generar mensaje</button>
    </div>
    <div class="wa-preview" id="waPreview">Presioná "Generar mensaje" para ver el pedido de insumos faltantes.</div>
    <div class="wa-actions">
      <button class="btn btn-wa" onclick="sendWhatsApp()">💬 Abrir WhatsApp</button>
      <button class="btn btn-ghost" onclick="copyMessage()">📋 Copiar</button>
    </div>
    <div class="wa-hint" id="waHint"></div>
  </div>

</div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <span class="modal-handle"></span>
    <h2 id="modalTitle">Agregar insumo</h2>
    <div class="form-grid">
      <div class="form-group full">
        <label>Nombre del insumo</label>
        <input type="text" id="fName" placeholder="Ej: Café molido" autocomplete="off">
      </div>
      <div class="form-group">
        <label>Categoría</label>
        <select id="fCat"></select>
      </div>
      <div class="form-group">
        <label>Unidad</label>
        <select id="fUnit">
          <option>kg</option>
          <option>g</option>
          <option>L</option>
          <option>ml</option>
          <option>unidades</option>
          <option>cajas</option>
          <option>bolsas</option>
          <option>paquetes</option>
          <option>docenas</option>
          <option>latas</option>
          <option>botellas</option>
        </select>
      </div>
      <div class="form-group">
        <label>Stock actual</label>
        <input type="number" id="fStock" placeholder="0" min="0" inputmode="decimal">
      </div>
      <div class="form-group">
        <label>Stock mínimo</label>
        <input type="number" id="fMin" placeholder="0" min="0" inputmode="decimal">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveItem()">Guardar</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const CATEGORIES = [
  "Café y derivados","Lácteos","Panadería y pastelería","Infusiones",
  "Azúcar y edulcorantes","Siropes y toppings","Bebidas frías","Jugos y smoothies",
  "Vasos y descartables","Packaging","Limpieza","Insumos de cocina","Snacks salados","Snacks dulces",
];

const DEFAULT_ITEMS = [
  { name:"Bolsa de Cafe",          cat:"Café y derivados",        unit:"kg",       stock:5,   min:3  },
  { name:"Leche entera",           cat:"Lácteos",                 unit:"L",        stock:12,  min:10 },
  { name:"Leche Crema",            cat:"Lácteos",                 unit:"L",        stock:4,   min:5  },
  { name:"Leche condensada",       cat:"Lácteos",                 unit:"L",        stock:2,   min:3  },
  { name:"Leche deslactosada",     cat:"Lácteos",                 unit:"L",        stock:1,   min:2  },
  { name:"Leche Descremada",       cat:"Lácteos",                 unit:"L",        stock:3,   min:2  },
  { name:"Medialunas",             cat:"Panadería y pastelería",  unit:"docenas",  stock:3,   min:2  },
  { name:"Criollitos",             cat:"Panadería y pastelería",  unit:"unidades", stock:10,  min:12 },
  { name:"Tostadas pan lactal",    cat:"Panadería y pastelería",  unit:"paquetes", stock:4,   min:3  },
  { name:"Pan de picada",          cat:"Panadería y pastelería",  unit:"unidades", stock:0,   min:6  },
  { name:"Croissant",              cat:"Panadería y pastelería",  unit:"kg",       stock:5,   min:5  },

let items  = JSON.parse(localStorage.getItem('cafe_stock') || 'null') || DEFAULT_ITEMS.map((i,idx) => ({...i, id: idx+1, selected: false}));
let nextId = Math.max(...items.map(i=>i.id)) + 1;
let editId = null;
let activeCat = 'Todos';

function save() { localStorage.setItem('cafe_stock', JSON.stringify(items)); }

function getStatus(item) {
  if (item.stock === 0) return 'zero';
  if (item.stock <= item.min) return 'low';
  return 'ok';
}
function statusLabel(s) { return s === 'zero' ? 'Sin stock' : s === 'low' ? 'Stock bajo' : 'OK'; }
function statusPill(s) {
  return `<span class="pill pill-${s==='zero'?'danger':s==='low'?'warn':'ok'}">${statusLabel(s)}</span>`;
}

function renderCatTabs() {
  const cats = ['Todos', ...CATEGORIES];
  document.getElementById('catTabs').innerHTML = cats.map(c =>
    `<button class="cat-tab ${c===activeCat?'active':''}" onclick="setCategory('${c}')">${c}</button>`
  ).join('');
}
function setCategory(cat) { activeCat = cat; renderCatTabs(); renderTable(); }

function renderTable() {
  const q  = document.getElementById('search').value.toLowerCase();
  const st = document.getElementById('filterStatus').value;
  let data = items.filter(i => {
    if (activeCat !== 'Todos' && i.cat !== activeCat) return false;
    if (q && !i.name.toLowerCase().includes(q)) return false;
    if (st) { if (getStatus(i) !== st) return false; }
    return true;
  });

  const tbody = document.getElementById('tableBody');
  const empty = document.getElementById('emptyMsg');

  if (!data.length) { tbody.innerHTML = ''; empty.style.display = ''; }
  else {
    empty.style.display = 'none';
    tbody.innerHTML = data.map(i => {
      const s = getStatus(i);
      return `<tr>
        <td><input type="checkbox" class="check-col" ${i.selected?'checked':''} onchange="toggleSelect(${i.id}, this.checked)"></td>
        <td><span class="item-name">${i.name}</span></td>
        <td><span class="item-cat">${i.cat}</span></td>
        <td>
          <div class="qty-ctrl">
            <button class="qty-btn" onclick="adj(${i.id},-1)">−</button>
            <input type="number" value="${i.stock}" min="0" inputmode="decimal"
              onchange="setStock(${i.id}, this.value)" onblur="setStock(${i.id}, this.value)">
            <button class="qty-btn" onclick="adj(${i.id},+1)">+</button>
          </div>
        </td>
        <td><input class="min-input" type="number" value="${i.min}" min="0" inputmode="decimal" title="Mínimo" onchange="setMin(${i.id}, this.value)"></td>
        <td style="color:var(--muted);white-space:nowrap">${i.unit}</td>
        <td>${statusPill(s)}</td>
        <td>
          <div class="td-actions">
            <button class="btn btn-ghost" onclick="openEditModal(${i.id})" title="Editar">✏</button>
            <button class="btn btn-ghost" style="color:var(--danger)" onclick="deleteItem(${i.id})" title="Eliminar">🗑</button>
          </div>
        </td>
      </tr>`;
    }).join('');
  }
  updateStats();
}

function updateStats() {
  document.getElementById('stat-total').textContent = items.length;
  document.getElementById('stat-ok').textContent    = items.filter(i=>getStatus(i)==='ok').length;
  document.getElementById('stat-low').textContent   = items.filter(i=>getStatus(i)==='low').length;
  document.getElementById('stat-zero').textContent  = items.filter(i=>getStatus(i)==='zero').length;
}

function adj(id, delta) {
  const i = items.find(x=>x.id===id); if (!i) return;
  i.stock = Math.max(0, i.stock + delta);
  save(); renderTable();
}
function setStock(id, val) {
  const i = items.find(x=>x.id===id); if (!i) return;
  i.stock = Math.max(0, parseFloat(val)||0);
  save(); renderTable();
}
function setMin(id, val) {
  const i = items.find(x=>x.id===id); if (!i) return;
  i.min = Math.max(0, parseFloat(val)||0);
  save(); renderTable();
}
function toggleSelect(id, val) {
  const i = items.find(x=>x.id===id);
  if (i) { i.selected = val; save(); updateStats(); }
}
function toggleCheckAll(el) {
  items.forEach(i => i.selected = el.checked);
  save(); renderTable();
}
function toggleSelectFaltantes() {
  items.forEach(i => i.selected = getStatus(i) !== 'ok');
  save(); renderTable(); toast('✅ Faltantes seleccionados');
}
function deleteItem(id) {
  if (!confirm('¿Eliminar este insumo?')) return;
  items = items.filter(x=>x.id!==id);
  save(); renderTable();
}

function openAddModal() {
  editId = null;
  document.getElementById('modalTitle').textContent = 'Agregar insumo';
  document.getElementById('fName').value = '';
  document.getElementById('fStock').value = '';
  document.getElementById('fMin').value = '';
  document.getElementById('fUnit').value = 'kg';
  fillCatSelect();
  document.getElementById('modalOverlay').classList.add('open');
  setTimeout(() => document.getElementById('fName').focus(), 300);
}
function openEditModal(id) {
  editId = id;
  const i = items.find(x=>x.id===id);
  document.getElementById('modalTitle').textContent = 'Editar insumo';
  document.getElementById('fName').value  = i.name;
  document.getElementById('fStock').value = i.stock;
  document.getElementById('fMin').value   = i.min;
  document.getElementById('fUnit').value  = i.unit;
  fillCatSelect(i.cat);
  document.getElementById('modalOverlay').classList.add('open');
}
function fillCatSelect(selected='') {
  const el = document.getElementById('fCat');
  el.innerHTML = CATEGORIES.map(c=>`<option ${c===selected?'selected':''}>${c}</option>`).join('');
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }
function saveItem() {
  const name  = document.getElementById('fName').value.trim();
  const cat   = document.getElementById('fCat').value;
  const unit  = document.getElementById('fUnit').value;
  const stock = parseFloat(document.getElementById('fStock').value)||0;
  const min   = parseFloat(document.getElementById('fMin').value)||0;
  if (!name) { alert('Ingresá un nombre'); return; }
  if (editId) {
    Object.assign(items.find(x=>x.id===editId), { name, cat, unit, stock, min });
  } else {
    items.push({ id: nextId++, name, cat, unit, stock, min, selected: false });
  }
  save(); closeModal(); renderTable(); renderCatTabs();
  toast(editId ? '✏ Insumo actualizado' : '✅ Insumo agregado');
}

function generateMessage() {
  const local    = document.getElementById('waLocal').value.trim() || 'Mi Cafetería';
  const selected = items.filter(i => i.selected);
  const faltantes= items.filter(i => getStatus(i) !== 'ok');
  const lista    = selected.length ? selected : faltantes;
  if (!lista.length) {
    document.getElementById('waPreview').textContent = '✅ No hay insumos faltantes o seleccionados.';
    return;
  }
  const fecha = new Date().toLocaleDateString('es-AR', { day:'2-digit', month:'2-digit', year:'numeric' });
  let msg = `📋 *PEDIDO DE INSUMOS — ${local.toUpperCase()}*\n📅 Fecha: ${fecha}\n\n`;
  const groups = {};
  lista.forEach(i => { if (!groups[i.cat]) groups[i.cat] = []; groups[i.cat].push(i); });
  for (const [cat, arr] of Object.entries(groups)) {
    msg += `*${cat}:*\n`;
    arr.forEach(i => {
      const s = getStatus(i);
      const icon = s === 'zero' ? '🔴' : '🟡';
      const falta = Math.max(0, i.min - i.stock);
      msg += `  ${icon} ${i.name}`;
      msg += s === 'zero' ? ` — SIN STOCK` : ` — stock: ${i.stock} ${i.unit} (mín: ${i.min})`;
      if (falta > 0) msg += ` → pedir: ${falta} ${i.unit}`;
      msg += `\n`;
    });
    msg += '\n';
  }
  msg += `_Enviado desde Café Admin_ ☕`;
  document.getElementById('waPreview').textContent = msg;
  document.getElementById('waHint').textContent = `${lista.length} insumo(s) en el pedido`;
}

function sendWhatsApp() {
  const msg = document.getElementById('waPreview').textContent;
  if (!msg || msg.startsWith('Presioná')) generateMessage();
  const num = document.getElementById('waNumber').value.replace(/\D/g,'');
  const encoded = encodeURIComponent(document.getElementById('waPreview').textContent);
  window.open(num ? `https://wa.me/${num}?text=${encoded}` : `https://wa.me/?text=${encoded}`, '_blank');
}

function copyMessage() {
  const msg = document.getElementById('waPreview').textContent;
  if (!msg || msg.startsWith('Presioná')) return;
  navigator.clipboard.writeText(msg).then(() => toast('📋 Mensaje copiado'));
}

function exportCSV() {
  const rows = [['Nombre','Categoría','Stock','Mínimo','Unidad','Estado']];
  items.forEach(i => rows.push([i.name, i.cat, i.stock, i.min, i.unit, statusLabel(getStatus(i))]));
  const csv = rows.map(r => r.map(c=>`"${c}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
  a.download = `stock_cafeteria_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  toast('⬇ CSV exportado');
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

renderCatTabs();
renderTable();
</script>
